<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>요청사항 남기기 | 깃든마켓</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="commission_request.css" />
    <link rel="stylesheet" href="static/css/preview-dialog.css" />
    <script src="static/js/product-preview.js" defer></script>
    <script src="static/js/commission-preview.js" defer></script>
  </head>
  <body data-product-page="commission">
    <!-- 공통 헤더 (로그인 후) -->
    <header class="site-header">
      <div class="header-top">
        <div class="header-brand"><a class="logo" href="#">깃든마켓</a></div>
        <form class="header-search" role="search">
          <input
            type="search"
            placeholder="머그가 필요한 순간"
            aria-label="작품 검색"
          />
          <button type="submit" aria-label="검색">
            <img src="assets/search.svg" width="20" height="20" alt="" />
          </button>
        </form>
        <a class="header-trending" href="#">
          <span class="header-trending__rank">2</span>
          <span class="header-trending__word">뜨개 키링</span>
          <img src="assets/chevron-down.svg" width="16" height="16" alt="" />
        </a>
        <nav class="header-account" aria-label="계정">
          <div class="header-shortcuts">
            <a class="nav-icon-link" href="#"
              ><img
                src="assets/heart.svg"
                width="24"
                height="24"
                alt=""
              />관심</a
            >
            <a class="nav-icon-link" href="#"
              ><img src="assets/user.svg" width="24" height="24" alt="" />내
              정보</a
            >
            <a class="nav-icon-link" href="#"
              ><img
                src="assets/cart.svg"
                width="24"
                height="24"
                alt=""
              />장바구니</a
            >
          </div>
          <span class="divider-vertical"></span>
          <a class="header-login" href="templates/login.html">로그아웃</a>
        </nav>
      </div>
      <nav class="header-bottom" aria-label="작품 탐색">
        <a class="header-category" href="#"
          ><img src="assets/grid.svg" width="18" height="18" alt="" />전체
          카테고리</a
        >
        <span class="divider-vertical"></span>
        <div class="header-menu">
          <a href="#">추천 작품</a>
          <a href="#">주제별 모음</a>
          <a href="#">아티클</a>
        </div>
      </nav>
    </header>

    <main class="commission">
      <!-- 왼쪽: 구매할 작품 -->
      <section class="product">
        <h2 class="product-title">구매할 작품</h2>
        <div class="product-card">
          <a href="templates/product_detail.html?product=linen" data-product-link
            ><img src="images/linen_pouch.png" alt="린넨 스트링 파우치" data-product-image
          /></a>
          <div class="product-info">
            <p class="seller" data-product-field="handle">@linen_sori</p>
            <p class="name">
              <a href="templates/product_detail.html?product=linen" data-product-link data-product-field="name">린넨 스트링 파우치</a>
            </p>
            <p class="price" data-product-field="price">16,000원</p>
            <p class="qty">2개</p>
          </div>
        </div>
      </section>

      <!-- 오른쪽: 요청 폼 -->
      <section class="request">
        <h1 class="form-title">
          <strong data-product-field="handle">@linen_sori</strong> 님에게 요청사항 남기기
        </h1>

        <p class="notice">
          요청 내용에 따라 추가 비용이 생길 수 있어요. 작가님이 확인 후 안내해
          드려요.
        </p>

        <form
          class="request-form"
          action="#"
          method="post"
          enctype="multipart/form-data"
        >
          <div class="field">
            <label for="request-text"
              >1. 요청사항을 작성해주세요.
              <span class="required">*</span></label
            >
            <textarea
              id="request-text"
              name="request_text"
              required
              placeholder="예) 연한 베이지 색으로, 손바닥만 한 크기로 떠 주세요"
            ></textarea>
          </div>

          <div class="field">
            <p class="label">
              2. 작가님이 참고할 이미지를 첨부해주세요. (선택)
            </p>
            <!-- label이 숨겨진 input을 대신 눌러 줌 -->
            <label class="upload-box">
              <input
                type="file"
                name="ref_images"
                accept="image/*"
                multiple
                hidden
              />
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#b3b3b3"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M16 5h6" />
                <path d="M19 2v6" />
                <path
                  d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"
                />
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
                <circle cx="9" cy="9" r="2" />
              </svg>
              <span>이미지 추가</span>
            </label>
            <p class="hint">최대 3장까지 올릴 수 있어요.</p>
            <p class="request-error" role="alert"></p>
          </div>

          <button type="submit" class="submit" aria-haspopup="dialog">요청 저장하기</button>
        </form>
      </section>
    </main>

    <dialog class="preview-dialog" id="commission-confirmation" aria-labelledby="commission-confirmation-title">
      <h2 id="commission-confirmation-title">커미션 요청 저장 완료</h2>
      <p><strong data-product-field="name">린넨 스트링 파우치</strong>에 남긴 요청이에요.</p>
      <p class="commission-request-preview"></p>
      <form class="preview-dialog-actions" method="dialog">
        <a class="preview-dialog-button" href="templates/product_detail.html?product=linen" data-product-link>상품 상세로</a>
        <button class="preview-dialog-button preview-dialog-primary" autofocus>확인</button>
      </form>
    </dialog>

    <footer class="site-footer">
      <span>깃든마켓</span>
      <a href="review_list.html">리뷰 모아보기 ↗</a>
    </footer>
  </body>
</html>
