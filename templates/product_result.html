<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>등록 결과 | 깃든 마켓</title>
    <link rel="stylesheet" href="../static/css/product.css" />
  </head>
  <body>
    <main>
      <div class="pg">
        <div class="pg-back">
          <a href="javascript:history.back()">
            <svg
              width="20"
              height="18"
              viewBox="0 0 21 19"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M6 1L1 6l5 5M1 6h13c4 0 6 3 6 6s-2 6-6 6H6" />
            </svg>
            돌아가기
          </a>
        </div>

        <div class="pg-head">
          <h1>등록 결과</h1>
          <p>상품이 등록되었어요. 입력한 정보를 확인해 주세요.</p>
        </div>

        <div class="pg-product">
          <div class="pg-gallery">
            <div class="pg-thumbcol">
              <div class="pg-thumb is-active">
                <img
                  src="../static/images/product_1.jpeg"
                  alt="뜨개 꽃 키링 사진 1"
                />
              </div>
              <div class="pg-thumb">
                <img
                  src="../static/images/product_1.jpeg"
                  alt="뜨개 꽃 키링 사진 2"
                />
              </div>
              <div class="pg-thumb">
                <img
                  src="../static/images/product_1.jpeg"
                  alt="뜨개 꽃 키링 사진 3"
                />
              </div>
            </div>

            <div class="pg-main">
              <img
                src="../static/images/product_1.jpeg"
                alt="뜨개 꽃 키링 대표 사진"
              />
              <span class="pg-count">1 / 3</span>
            </div>
          </div>

          <!-- 오른쪽: 상품 정보 -->
          <div class="pg-info">
            <div class="pg-seller"><i></i>ewha_creator02</div>
            <h2 class="pg-name">뜨개 꽃 키링</h2>
            <p class="pg-price">8,000원</p>
            <dl class="pg-rows">
              <div>
                <dt>상품 상태</dt>
                <dd>새 상품</dd>
              </div>
              <div>
                <dt>거래 희망 장소</dt>
                <dd>
                  <svg
                    width="14"
                    height="20"
                    viewBox="0 0 16 22"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path
                      d="M8 21C2.5 14.5 1 11.5 1 8.5a7 7 0 0 1 14 0c0 3-1.5 6-7 12.5z"
                    />
                  </svg>
                  이화여대 ECC (서울 서대문구 이화여대길 52)
                </dd>
              </div>
              <div>
                <dt>커미션</dt>
                <dd><span class="pg-chip">커미션 가능</span></dd>
              </div>
            </dl>
          </div>
        </div>

        <!-- 상품 설명 (탭 없이 한 구역) -->
        <div class="pg-tabs pg-single-tab">
          <div class="pg-tablist"><label>상품 설명</label></div>
          <div class="pg-panels">
            <div class="pg-panel">
              <p>코바늘로 정성껏 뜬 데이지 꽃 키링이에요. 크기는 약 6cm예요.</p>
            </div>
          </div>
        </div>

        <div class="pg-after">
          <a class="pg-btn pg-btn--dark" href="/">목록으로</a>
          <!-- href는 상품 등록 페이지 주소로 바꿔 주세요 -->
          <a class="pg-btn pg-btn--outline" href="#">상품 더 등록하기</a>
        </div>
      </div>
    </main>
  </body>
</html>
