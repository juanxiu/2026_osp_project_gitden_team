<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 룰렛 | 깃든마켓</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="../static/roulette.css">
</head>
<body>
    <main>
        <section class="roulette-page">
            <h1>오늘의 룰렛</h1>
            <p class="roulette-subtitle">작은 행운으로, 내 공간을 더 특별하게.</p>

            <img class="roulette-img" src="../static/images/roulette_wheel.png"

            <p class="roulette-message">오늘의 행운을 확인해 보세요.</p>
            <button class="roulette-button" type="button">룰렛 돌리기</button>
            <p class="roulette-hint">꽝 또는 꾸미기 아이템 중 하나를 만나요.</p>
