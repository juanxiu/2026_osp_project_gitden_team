<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>깃든마켓 로그인</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    <main>
        <section class="auth-card" aria-labelledby="auth-title">
            <h1 id="auth-title">깃든마켓</h1>
            <p class="auth-subtitle">대학생 창작자의 작품을 만나는 곳</p>
            <p class="auth-divide"><span class="line"></span>깃든마켓 로그인<span class="line"></span></p>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
                <script>alert("{{ messages[0] }}")</script>
            {% endif %}

            <form class="auth-form" method="post" action="{{ url_for('auth.login') }}">
                <div class="form-field">
                    <label for="login-id">아이디</label>
                    <input id="login-id" name="id" type="text" placeholder="아이디를 입력해 주세요" autocomplete="username" required>
                    {% if messages %}
                    <p class="error-msg" role="alert">아이디를 잘못 입력하였습니다.</p>
                    {% endif %}
                </div>

                <div class="form-field">
                    <label for="login-pw">비밀번호</label>
                    <input id="login-pw" name="pw" type="password" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password" required>
                    {% if messages %}
                    <p class="error-msg" role="alert">비밀번호를 잘못 입력하였습니다.</p>
                    {% endif %}
                </div>

                <button class="submit" type="submit">로그인하기</button>
            </form>

            <p class="auth-switch">아직 계정이 없으신가요? <a class="switch-link" href="{{ url_for('auth.signup') }}">회원가입</a></p>
            {% endwith %}
        </section>
    </main>
</body>
</html>
